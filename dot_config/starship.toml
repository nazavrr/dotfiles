format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$all
$character"""
right_format = """$cmd_duration"""
add_newline = true

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
gray = "#a89984"
orange = "#fe8019"

[username]
format = '[$user]($style) '
style_user = "bold yellow"

[hostname]
format = '[$ssh_symbol$hostname]($style) '
style = "bold green"

[directory]
fish_style_pwd_dir_length = 2
read_only = " 󰌾"
style = "bold cyan"
read_only_style = "bold cyan"

[git_branch]
format = "[$branch(:$remote_branch)]($style) "
style = "bold gray"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
format = '([\[($conflicted )($stashed )($deleted )($renamed )($modified )($typechanged )($staged )($untracked)($ahead_behind)\]]($style) )'
conflicted = '[=$count](bold red)'
ahead = '[⇡ $count](bold green)'
behind = '[⇣ $count](bold red)'
diverged = '⇕ ⇡ ${ahead_count}⇣ ${behind_count}'
untracked = '[?$count](bold cyan)'
stashed = '[≡$count](bold purple)'
modified = '[!$count](bold yellow)'
staged = '[+$count](bold green)'
renamed = '[ $count](bold orange)'
deleted = '[$count](bold red)'
style = 'gray'

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = ' '
style = "bold blue"
detect_extensions = []

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'

[cmd_duration]
min_time = 100
show_milliseconds = true
format = '[took $duration]($style)'
style = "italic gray"

[nodejs]
format = '[$symbol($version )]($style)'

[lua]
format = '[$symbol($version )]($style)'
symbol = ' '

[terraform]
format = '[$symbol$workspace]($style) '
symbol = ' '
detect_files = ['.terraform-version']

# Disabled modules go here
[line_break]
disabled = true

[aws]
disabled = true

[package]
disabled = true

[battery]
disabled = true
