# Options
set -s escape-time 0
set -s focus-events on
set -sa terminal-features ',*:RGB'
set -g base-index 1
set -g display-time 4000
set -g history-limit 50000
set -g mouse on
set -g renumber-windows on
set -g status-interval 5
set -g status-keys emacs
set -gw aggressive-resize on
set -gw mode-keys vi
set -gw pane-base-index 1

# Key bindings
set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind R source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "Config Reloaded"
bind C-n next-window
bind C-p previous-window
bind C-l send-keys 'C-l'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-pipe
# Open panes and windows in CWD
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Pane navigation and neovim integration via smart-splits.nvim
bind -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'
bind -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

# Status Line Style
set -g @color-bg "#282828"
set -g @color-fg "#ebdbb2"
set -g @color-primary "#fe8019"
set -g @color-bg-alt "#3c3836"
set -g @session-str "    #{session_name}  "
set -g @window-fmt " #I:#W#{?window_activity_flag,##,}#{?window_bell_flag,!,}#{?window_silence_flag,~,}#{?window_marked_flag,M,} #{?window_zoomed_flag,  ,}"
set -g status-style "bg=#{@color-bg},fg=#{@color-fg},bold"
set -g status-left ""
set -g status-right "#{?client_prefix,#[bg=#{@color-primary}#,fg=#{@color-bg}]#{E:@session-str},#{E:@session-str}}"
set -g window-status-format "#{E:@window-fmt}"
set -g window-status-current-format "#{#[bg=#{@color-primary}#,fg=#{@color-bg}]#{E:@window-fmt}}"
set -g window-status-last-style "bg=#{@color-bg-alt}"
